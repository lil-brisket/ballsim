name: CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Required at Prisma client construction during next build.
  # Build does not query the DB for current dynamic routes; use a real local file URL.
  DATABASE_URL: file:./prisma/ci.db

# Jobs run in parallel; PR wall time is the slowest job, not the sum.
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Wall-clock budgets warn instead of failing on shared runners;
      # the nightly workflow runs them strictly.
      PERF_BUDGET_MODE: warn
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test with coverage (unit + integration + react)
        run: npm run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Slow tests (*.slow.test.ts)
        run: npm run test:slow

  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Simulation Lab (rotation-on, 100 games)
        run: npm run test:simulation

  regression:
    runs-on: ubuntu-latest
    # ~5 min locally; runs beside the other jobs so golden-fixture breaks
    # show up on the PR instead of the next nightly run.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regression suites
        run: npm run test:regression

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # The seeded league (npm run e2e:seed); the seed exports E2E_SAVE_ID.
      DATABASE_URL: file:./prisma/e2e.db
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Seed test league
        run: npm run e2e:seed

      - name: Build
        run: npm run build

      # Playwright starts `npm run start` itself (CI=true).
      - name: Browser tests (375, 768, 1280, 1920)
        run: npm run test:e2e

      - name: Upload report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      # A screen without a committed baseline fails once and writes one;
      # this artifact holds it for review and commit.
      - name: Upload new baselines
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-baselines
          path: e2e/baselines/linux/
          if-no-files-found: ignore
