name: E2E baselines

# Regenerates the visual baselines for the seeded league on Linux (so fonts
# match the CI e2e job) and commits them to the branch it runs on. Run it
# after an intended visual change.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: file:./prisma/e2e.db
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Seed test league
        run: npm run e2e:seed

      - name: Build
        run: npm run build

      - name: Update visual baselines
        run: npx playwright test e2e/visual.spec.ts --update-snapshots

      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/baselines/linux
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
          else
            git commit -m "test(e2e): refresh visual baselines"
            git push
          fi
